name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MistMapper.sln

      - name: Build
        run: dotnet build MistMapper.sln -c Release --no-restore

      - name: Test
        run: dotnet test MistMapper.sln -c Release --no-build --verbosity normal

  # Full UWP + Setup build is expensive; skip on ordinary main pushes.
  build-installer:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build MistMapper-Setup.exe
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1

      - name: Smoke-check release payload
        shell: pwsh
        run: |
          ./scripts/smoke-release.ps1 -RequireSetup

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MistMapper-Setup
          path: |
            publish/Installer/MistMapper-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Game Bar package (debug)
        uses: actions/upload-artifact@v4
        with:
          name: MistMapper-GameBarWidget
          path: |
            publish/GameBarWidget/*.msix
            publish/GameBarWidget/*.cer
          if-no-files-found: warn
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: build-installer
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MistMapper-Setup
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MistMapper-Setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
