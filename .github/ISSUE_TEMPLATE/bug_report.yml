name: Bug report
description: Something is broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, see SECURITY.md (do not file publicly).
  - type: input
    id: version
    attributes:
      label: MistMapper version
      description: Release tag or Setup version (e.g. 0.1.6)
    validations:
      required: true
  - type: dropdown
    id: controller
    attributes:
      label: Controller
      options:
        - Steam Controller 2026 (SC2)
        - Steam Controller 2015 (SC1)
        - DualSense
        - DualSense Edge
        - Other / multiple
        - None / N/A
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: From %AppData%\MistMapper\logs\ — redact sensitive paths
